# Hearth: on a Pi 4, Android (Waydroid) audio dropped out every few seconds at
# PipeWire's default 256-sample quantum (484 xruns on the HDMI sink in one
# evening). A 1024-sample floor (~21 ms) fixed it; that latency is fine for TV.
# Installed to ~/.config/pipewire/pipewire.conf.d/hearth.conf by deploy.sh.
# Apply live without a restart: pw-metadata -n settings 0 clock.min-quantum 1024
context.properties = {
    default.clock.min-quantum = 1024
}
