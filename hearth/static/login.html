<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearth</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hearth">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<link rel="stylesheet" href="/static/remote.css">
</head>
<body class="login" style="padding-bottom:0">
<form id="f" class="card">
  <h1>Hearth</h1>
  <input class="field" id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
  <button class="chip accent">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err');
    err.textContent = '';
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value }) });
    const next = new URLSearchParams(location.search).get('next') || '';
    if (r.ok) { location.href = /^\/[a-z]/.test(next) ? next : '/'; return; }
    const d = await r.json().catch(() => ({}));
    err.textContent = d.detail || 'Sign-in failed';
  });
</script>
</body>
</html>
